<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Самоперевірка</title>
<meta name="color-scheme" content="light dark">
<style>
  :root {
    --bg: #fafafa; --surface: #ffffff; --hover: #f3f6fa; --border: #e5e5e5;
    --fg: #1b1b1b; --muted: #6e6e6e; --accent: #005fb8; --accent-fg: #ffffff; --accent-bg: #e8f1fb;
    --ok: #0f7b0f; --ok-bg: #dff6dd; --bad: #c42b1c; --bad-bg: #fde7e9; --warn: #9d5d00;
    --radius: 8px; --shadow: 0 1px 2px rgba(0,0,0,.05);
  }
  [data-theme="dark"] {
    --bg: #1c1c1c; --surface: #2b2b2b; --hover: #323232; --border: #3a3a3a;
    --fg: #ffffff; --muted: #a5a5a5; --accent: #60cdff; --accent-fg: #000000; --accent-bg: #1d3646;
    --ok: #6ccb5f; --ok-bg: #213a20; --bad: #ff99a4; --bad-bg: #46272a; --warn: #fce100;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body {
    font: 16px/1.45 "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, "SF Pro Text", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 40px; min-height: 100vh; display: flex; flex-direction: column; }
  h1 { font-size: 30px; margin: 0; letter-spacing: -.01em; }
  h2 { font-size: 19px; margin: 26px 0 10px; }
  .muted { color: var(--muted); font-size: 14px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .spread { justify-content: space-between; }
  .grow { flex: 1; }

  button, .btn {
    font: inherit; font-size: 15px; color: var(--fg); background: var(--surface);
    border: 1px solid var(--border); border-radius: 6px; padding: 7px 14px; cursor: pointer;
    box-shadow: var(--shadow); transition: background .12s, border-color .12s; display: inline-flex; align-items: center; gap: 8px;
  }
  button:hover, .btn:hover { background: var(--hover); }
  button:focus-visible, .btn:focus-within, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.08); }
  button.big { padding: 10px 20px; font-size: 16px; }
  button:disabled { opacity: .5; cursor: default; }
  kbd { font: 12px ui-monospace, monospace; opacity: .7; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; }
  .btn input[type=file] { display: none; }
  @media (pointer: coarse) { kbd { display: none; } }  /* на телефоні підказки клавіш не потрібні */

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 560px) { .grid2 { grid-template-columns: 1fr; } h1 { font-size: 26px; } }

  .card {
    display: flex; gap: 12px; align-items: flex-start; text-align: left; width: 100%;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 12px 14px; cursor: pointer; color: var(--fg);
  }
  .card:hover { background: var(--hover); }
  .card .icon { color: var(--accent); font-size: 20px; line-height: 1.2; width: 22px; text-align: center; }
  .card b { display: block; font-size: 15px; }
  .card small { color: var(--muted); font-size: 13px; }
  .card.selected { background: var(--accent-bg); border-color: var(--accent); }
  .card.ok { background: var(--ok-bg); border-color: var(--ok); }
  .card.bad { background: var(--bad-bg); border-color: var(--bad); }
  .card.done { cursor: default; }
  .card.done:not(.ok):not(.bad):hover { background: var(--surface); }
  .choices { display: flex; flex-direction: column; gap: 8px; }

  label.field { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
  label.field > span { min-width: 140px; }
  input[type=number], select, textarea {
    font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--border);
    border-radius: 6px; padding: 7px 10px;
  }
  input[type=number] { width: 90px; }
  select { max-width: 100%; flex: 1; min-width: 0; }
  textarea { width: 100%; min-height: 180px; resize: vertical; padding: 12px 14px; line-height: 1.5; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }

  .switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; margin: 8px 0; }
  .switch input { appearance: none; width: 40px; height: 20px; border-radius: 10px; margin: 0;
    border: 1px solid var(--muted); position: relative; cursor: pointer; transition: background .15s; background: transparent; }
  .switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 50%;
    background: var(--muted); transition: transform .15s; }
  .switch input:checked { background: var(--accent); border-color: var(--accent); }
  .switch input:checked::after { background: var(--accent-fg); transform: translateX(20px); }

  .progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin: 10px 0 16px; }
  .progress > div { height: 100%; background: var(--accent); transition: width .25s; }
  .question { padding: 14px 20px 16px; }
  .question .topic { color: var(--muted); font-size: 13px; min-height: 18px; }
  .question .text { font-size: 21px; font-weight: 600; margin-top: 2px; }
  .body { flex: 1; margin-top: 16px; display: flex; flex-direction: column; }
  .hint { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .answer { padding: 14px 18px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer .label { color: var(--muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; margin-top: 10px; }
  .answer .label:first-child { margin-top: 0; }
  .answer .ok { color: var(--ok); } .answer .bad { color: var(--bad); }
  .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 16px;
    position: sticky; bottom: 0; background: var(--bg); padding: 10px 0; }
  .verdict { font-size: 18px; font-weight: 700; margin-right: 8px; }
  .verdict.ok { color: var(--ok); } .verdict.bad { color: var(--bad); }

  .result { display: flex; align-items: center; gap: 20px; padding: 16px 24px; margin-top: 16px; }
  .result .pct { font-size: 52px; font-weight: 700; line-height: 1; }
  .mistake { padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: pre-wrap; }
  .mistake:last-child { border-bottom: none; }
  .mistake b { display: block; margin-bottom: 4px; }

  .tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 16px 0; }
  @media (max-width: 560px) { .tiles { grid-template-columns: 1fr 1fr; } }
  .tile { padding: 12px 16px; }
  .tile .v { font-size: 28px; font-weight: 700; }
  .table-wrap { overflow: auto; max-height: 60vh; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: center; }
  th:first-child, td:first-child { text-align: left; }
  th { position: sticky; top: 0; background: var(--surface); cursor: pointer; user-select: none; font-weight: 600; }
  tr.weak td { color: var(--bad); } tr.new td { color: var(--muted); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--fg); color: var(--bg);
    padding: 10px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; }
  .toast.show { opacity: .95; }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>

<script>
"use strict";

/* ===================================================================
   Самоперевірка — веб-версія. Та сама логіка, що й у core.py,
   перенесена на JavaScript. Сервер не потрібен: усе працює в браузері,
   статистика зберігається в localStorage (окремо на кожному пристрої).
   =================================================================== */

// ------------------------------------------------------------ сховище ---
// localStorage може бути недоступний (приватний режим, заборона) — тоді працюємо без збереження.
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); return true; }
    catch { return false; }
  },
  remove(key) { try { localStorage.removeItem(key); } catch {} },
};
const K = { questions: "sc.questions", source: "sc.source", stats: "sc.stats", settings: "sc.settings", theme: "sc.theme" };

const DEMO = [
  { number: "7", topic: "Приклад", question: "Опис професійних цінностей",
    answers: ["Обов'язок", "Вірність", "Благонадійність", "Мужність", "Самовіддана служба", "Повага", "Дисципліна", "Честь"] },
  { number: "1", topic: "Демо", question: "Назвіть основні кольори моделі RGB", answers: ["Червоний", "Зелений", "Синій"] },
  { number: "2", topic: "Демо", question: "Що таке масштаб карти?",
    answers: ["Відношення довжини відрізка на карті до його довжини на місцевості"] },
  { number: "3", topic: "Демо", question: "Перелічіть види масштабу", answers: ["Числовий", "Іменований", "Лінійний"] },
];

const MODES = {
  cards:   ["▤", "Картки", "Згадай відповідь і оціни себе"],
  test:    ["☑", "Тест", "Обери один з чотирьох варіантів"],
  written: ["✎", "Письмова відповідь", "Напиши, програма перевірить"],
  mixed:   ["⇄", "Змішаний", "Режим обирається випадково"],
};
const MAX_BOX = 5;

// ------------------------------------------------------------- питання ---
function parseQuestions(data) {
  if (data && !Array.isArray(data)) data = data.questions || [];
  if (!Array.isArray(data)) throw new Error("Очікувався список питань");
  const result = [];
  for (const item of data) {
    let answers = item.answers || [];
    if (typeof answers === "string") answers = [answers];
    answers = answers.map(a => String(a).trim()).filter(Boolean);
    const text = String(item.question || "").trim();
    if (text && answers.length) {
      result.push({ text, answers, topic: item.topic || "", number: String(item.number ?? ""), key: hashKey(text) });
    }
  }
  return result;
}

// Стабільний ключ для статистики з тексту питання (хеш cyrb53).
function hashKey(text) {
  const s = text.toLowerCase().split(/\s+/).filter(Boolean).join(" ");
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) {
    const ch = s.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
}

const answerText = q => q.answers.length === 1 ? q.answers[0] : q.answers.map(a => "• " + a).join("\n");
function shortAnswer(q, limit = 220) {
  const s = q.answers.join(", ");
  return s.length <= limit ? s : s.slice(0, limit - 1).trimEnd() + "…";
}

// ---------------------------------------------------------- статистика ---
const Stats = {
  data: store.get(K.stats, {}),
  get(q) { return this.data[q.key] || { shown: 0, correct: 0, box: 0, last: 0 }; },
  record(q, correct) {
    const s = { ...this.get(q) };
    s.shown += 1;
    if (correct) { s.correct += 1; s.box = Math.min(s.box + 1, MAX_BOX); } else { s.box = 0; }
    s.last = Date.now();
    this.data[q.key] = s;
    store.set(K.stats, this.data);
  },
  weight(q) { return 1 / 2 ** this.get(q).box; },
  isWeak(q) { const s = this.get(q); return s.shown === 0 || s.box < 2; },
  reset() { this.data = {}; store.set(K.stats, this.data); },
};

// --------------------------------------------------------- вибір питань ---
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Зважений вибір без повторів (Ефраїмідіс–Спіракіс): ключ = random ** (1 / вага).
function pickSession(questions, size, weakOnly) {
  const pool = (weakOnly ? questions.filter(q => Stats.isWeak(q)) : [...questions])
    .map(q => [Math.random() ** (1 / Stats.weight(q)), q])
    .sort((a, b) => b[0] - a[0])
    .map(([, q]) => q);
  return pool.slice(0, Math.min(size, pool.length));
}

function makeChoices(q, questions, n = 4) {
  const same = (a, b) => a.answers.join("\u0001") === b.answers.join("\u0001");
  const others = shuffle(questions.filter(o => o !== q && !same(o, q)));
  others.sort((a, b) =>
    (a.topic !== q.topic) - (b.topic !== q.topic) ||
    Math.abs(a.answers.length - q.answers.length) - Math.abs(b.answers.length - q.answers.length));
  const candidates = shuffle(others.slice(0, (n - 1) * 3)).slice(0, n - 1);
  return shuffle([q, ...candidates]);
}

// ---------------------------------------------- перевірка відповіді ---
function normalize(s) {
  return s.toLowerCase()
    .replace(/[’ʼ`‘]/g, "'")
    .replace(/[^\p{L}\p{N}_'\s]/gu, " ")
    .split(/\s+/).filter(Boolean).join(" ");
}

// Аналог difflib.SequenceMatcher.ratio() з Python (алгоритм Ratcliff–Obershelp).
function matching(a, b) {
  if (!a.length || !b.length) return 0;
  let best = 0, ai = 0, bi = 0;
  const dp = new Array(b.length + 1).fill(0);
  for (let i = 1; i <= a.length; i++) {
    let prev = 0;
    for (let j = 1; j <= b.length; j++) {
      const tmp = dp[j];
      if (a[i - 1] === b[j - 1]) {
        dp[j] = prev + 1;
        if (dp[j] > best) { best = dp[j]; ai = i - best; bi = j - best; }
      } else dp[j] = 0;
      prev = tmp;
    }
  }
  if (!best) return 0;
  return best + matching(a.slice(0, ai), b.slice(0, bi)) + matching(a.slice(ai + best), b.slice(bi + best));
}
const similar = (a, b) => (a.length + b.length) ? 2 * matching(a, b) / (a.length + b.length) : 1;

function wordsMatch(userWord, keyWord) {
  const stem = keyWord.slice(0, Math.max(4, keyWord.length - 4));
  return userWord.startsWith(stem) || similar(userWord, keyWord) >= 0.8;
}
function itemsMatch(u, e) {
  if (u === e || similar(u, e) >= 0.8) return true;
  const uw = u.split(" "), ew = e.split(" ");
  return uw.length === ew.length && uw.every((w, i) => wordsMatch(w, ew[i]));
}

function checkWritten(q, userText, threshold = 0.7) {
  if (q.answers.length > 1) {
    const items = userText.split(/[\n,;]+/).map(normalize).filter(Boolean);
    const used = new Set();
    const details = q.answers.map(exp => {
      const e = normalize(exp);
      const hit = items.findIndex((it, i) => !used.has(i) && itemsMatch(it, e));
      if (hit >= 0) used.add(hit);
      return [exp, hit >= 0];
    });
    const score = details.filter(d => d[1]).length / details.length;
    return { score, passed: score >= threshold, details, mode: "items" };
  }
  const qWords = new Set(normalize(q.text).split(" "));
  const keywords = [...new Set(normalize(q.answers[0]).split(" ").filter(w => w.length >= 5 && !qWords.has(w)))];
  const userWords = normalize(userText).split(" ").filter(Boolean);
  if (!keywords.length) {
    const score = similar(normalize(userText), normalize(q.answers[0]));
    return { score, passed: score >= threshold, details: [], mode: "keywords" };
  }
  const details = keywords.map(k => [k, userWords.some(u => wordsMatch(u, k))]);
  const score = details.filter(d => d[1]).length / details.length;
  return { score, passed: score >= threshold * 0.85, details, mode: "keywords" };
}

// ================================================================ UI ===
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const $ = sel => app.querySelector(sel);
const $$ = sel => [...app.querySelectorAll(sel)];
let onKey = null;  // обробник клавіш поточного екрана

const state = {
  questions: [],
  source: "",
  settings: Object.assign({ mode: "cards", size: 20, weakOnly: false, topic: "" }, store.get(K.settings, {})),
};

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}

// ----- тема
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
}
function currentTheme() {
  return store.get(K.theme, null) || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
}
function toggleTheme() {
  const next = currentTheme() === "dark" ? "light" : "dark";
  store.set(K.theme, next); applyTheme(next); renderMenu();
}

// ----- клавіатура: один глобальний обробник, кожен екран підставляє свій onKey
document.addEventListener("keydown", e => {
  if (!onKey) return;
  const inField = /^(TEXTAREA|INPUT|SELECT)$/.test(e.target.tagName);
  if (inField && !(e.key === "Enter" && (e.ctrlKey || e.metaKey))) return;
  if (onKey(e) === true) e.preventDefault();
});

function readFile(input, cb) {
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try { cb(JSON.parse(reader.result), file.name); }
    catch (err) { alert("Не вдалося прочитати файл:\n" + err.message); }
    input.value = "";
  };
  reader.readAsText(file, "utf-8");
}

// ============================================================== Меню ===
function renderMenu() {
  onKey = e => { if (e.key === "Enter") { start(); return true; } };
  const s = state.settings;
  const topics = [...new Set(state.questions.map(q => q.topic).filter(Boolean))].sort();
  if (s.topic && !topics.includes(s.topic)) s.topic = "";
  const dark = currentTheme() === "dark";

  app.innerHTML = `
    <div class="row spread">
      <h1>Самоперевірка</h1>
      <label class="switch"><input type="checkbox" id="theme" ${dark ? "checked" : ""}> Темна тема</label>
    </div>
    <div class="row spread" style="margin-top:14px">
      <span class="muted">${esc(state.source)} · питань: ${state.questions.length}</span>
      <div class="row">
        <label class="btn">Відкрити JSON…<input type="file" id="file" accept=".json,application/json"></label>
        <button id="stats">Статистика</button>
      </div>
    </div>

    <h2>Режим</h2>
    <div class="grid2">
      ${Object.entries(MODES).map(([key, [icon, name, desc]]) => `
        <button class="card ${s.mode === key ? "selected" : ""}" data-mode="${key}">
          <span class="icon">${icon}</span><span><b>${name}</b><small>${desc}</small></span>
        </button>`).join("")}
    </div>

    <h2>Сесія</h2>
    <label class="field"><span>Кількість питань</span>
      <input type="number" id="size" min="1" max="1000" value="${s.size}"></label>
    ${topics.length ? `<label class="field"><span>Тема</span>
      <select id="topic"><option value="">Усі теми</option>
        ${topics.map(t => `<option ${t === s.topic ? "selected" : ""}>${esc(t)}</option>`).join("")}
      </select></label>` : ""}
    <label class="switch"><input type="checkbox" id="weak" ${s.weakOnly ? "checked" : ""}> Лише слабкі та нові питання</label>

    <div style="margin-top:24px"><button class="primary big" id="start" ${state.questions.length ? "" : "disabled"}>Почати</button></div>
  `;

  $("#theme").onchange = toggleTheme;
  $("#stats").onclick = renderStats;
  $$("[data-mode]").forEach(b => b.onclick = () => {
    s.mode = b.dataset.mode;
    $$("[data-mode]").forEach(x => x.classList.toggle("selected", x === b));
  });
  $("#file").onchange = e => readFile(e.target, (data, name) => {
    const qs = parseQuestions(data);
    if (!qs.length) { alert("У файлі не знайдено жодного питання з відповіддю."); return; }
    // Зберігаємо лише в цьому браузері — питання нікуди не відправляються.
    if (!store.set(K.questions, data)) toast("Не вдалося зберегти: після перезавантаження сторінки файл треба буде відкрити знову");
    store.set(K.source, name);
    state.questions = qs; state.source = name;
    renderMenu(); toast(`Завантажено питань: ${qs.length}`);
  });
  $("#start").onclick = start;
}

function start() {
  const s = state.settings;
  s.size = Math.max(1, parseInt($("#size").value, 10) || 20);
  s.weakOnly = $("#weak").checked;
  s.topic = $("#topic") ? $("#topic").value : "";
  store.set(K.settings, s);
  const pool = s.topic ? state.questions.filter(q => q.topic === s.topic) : state.questions;
  const session = pickSession(pool, s.size, s.weakOnly);
  if (!session.length) { toast("Слабких питань не залишилось — вимкни перемикач, щоб повторити все"); return; }
  runSession(session, s.mode);
}

// ============================================================== Сесія ===
function runSession(session, mode) {
  let index = 0;
  const results = [];

  function answer(correct) {
    Stats.record(session[index], correct);
    results.push([session[index], correct]);
    index += 1;
    index >= session.length ? renderResult(results, mode) : show();
  }

  function frame(bodyHtml, actionsHtml) {
    const q = session[index];
    const correct = results.filter(r => r[1]).length;
    app.innerHTML = `
      <div class="row spread">
        <span class="muted">Питання ${index + 1} з ${session.length} · правильно: ${correct}</span>
        <button id="finish">Завершити</button>
      </div>
      <div class="progress"><div style="width:${index / session.length * 100}%"></div></div>
      <div class="panel question">
        <div class="topic">${esc(q.topic)}</div>
        <div class="text">${q.number ? esc(q.number) + ". " : ""}${esc(q.text)}</div>
      </div>
      <div class="body">${bodyHtml}</div>
      <div class="actions">${actionsHtml}</div>`;
    $("#finish").onclick = () => renderResult(results, mode);
  }

  function show() {
    let m = mode;
    if (m === "mixed") {
      const options = ["cards", "written"];
      if (state.questions.length >= 3) options.push("test");
      m = options[Math.floor(Math.random() * options.length)];
    }
    if (m === "test" && state.questions.length < 3) m = "cards";
    ({ cards, test, written })[m]();
  }

  const keys12 = e => {
    if (e.key === "1") { answer(true); return true; }
    if (e.key === "2") { answer(false); return true; }
  };

  // ----- Картки
  function cards() {
    frame(`<div class="hint">Згадай відповідь, потім відкрий її.</div>`,
          `<button class="primary big" id="reveal">Показати відповідь <kbd>Пробіл</kbd></button>`);
    $("#reveal").onclick = reveal;
    onKey = e => { if (e.key === " " || e.key === "Enter") { reveal(); return true; } };
  }
  function reveal() {
    const q = session[index];
    frame(`<div class="hint">Правильна відповідь</div><div class="panel answer">${esc(answerText(q))}</div>`,
          `<span>Ти знав?</span>
           <button class="primary big" id="yes">✓ Знав <kbd>1</kbd></button>
           <button class="big" id="no">✗ Не знав <kbd>2</kbd></button>`);
    $("#yes").onclick = () => answer(true);
    $("#no").onclick = () => answer(false);
    onKey = keys12;
  }

  // ----- Тест
  function test() {
    const q = session[index];
    const choices = makeChoices(q, state.questions);
    frame(`<div class="hint">Обери правильну відповідь (клавіші 1–${choices.length})</div>
           <div class="choices">${choices.map((c, i) =>
             `<button class="card" data-i="${i}"><span>${i + 1}.&nbsp; ${esc(shortAnswer(c))}</span></button>`).join("")}</div>`, "");
    const pick = n => {
      const correct = choices[n] === q;
      $$(".choices .card").forEach((b, i) => {
        b.classList.add("done"); b.onclick = null;
        if (choices[i] === q) b.classList.add("ok");
      });
      if (!correct) $$(".choices .card")[n].classList.add("bad");
      $(".actions").innerHTML = `
        <span class="verdict ${correct ? "ok" : "bad"}">${correct ? "✓ Правильно" : "✗ Неправильно"}</span>
        <button class="primary big" id="next">Далі <kbd>Enter</kbd></button>`;
      $("#next").onclick = () => answer(correct);
      $("#next").focus({ preventScroll: true });
      onKey = e => { if (e.key === "Enter") { answer(correct); return true; } };
    };
    $$(".choices .card").forEach((b, i) => b.onclick = () => pick(i));
    onKey = e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= choices.length) { pick(n - 1); return true; }
    };
  }

  // ----- Письмова відповідь
  function written() {
    const q = session[index];
    const hint = q.answers.length > 1 ? "Кожен пункт з нового рядка або через кому." : "Напиши відповідь своїми словами.";
    frame(`<div class="hint">${hint}</div><textarea id="input" placeholder="Твоя відповідь…"></textarea>`,
          `<button class="primary big" id="check">Перевірити <kbd>Ctrl+Enter</kbd></button>
           <button class="big" id="giveup">Не знаю</button>`);
    const input = $("#input");
    if (matchMedia("(pointer: fine)").matches) input.focus();  // на телефоні не відкриваємо клавіатуру самі
    $("#check").onclick = () => check(input.value.trim(), false);
    $("#giveup").onclick = () => check("", true);
    onKey = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { check(input.value.trim(), false); return true; } };
  }
  function check(userText, gaveUp) {
    const q = session[index];
    const r = checkWritten(q, userText);
    let html = "";
    if (userText) html += `<div class="label">Твоя відповідь</div><div>${esc(userText)}</div>`;
    html += `<div class="label">Правильна відповідь</div>`;
    if (r.mode === "items") {
      html += r.details.map(([item, ok]) => `<div class="${ok ? "ok" : "bad"}">${ok ? "✓" : "✗"}&nbsp; ${esc(item)}</div>`).join("");
    } else {
      html += `<div>${esc(q.answers[0])}</div>`;
      const missed = r.details.filter(d => !d[1]).map(d => d[0]);
      if (missed.length && userText) html += `<div class="label">Не згадано ключові слова</div><div class="bad">${esc(missed.join(", "))}</div>`;
    }
    const suggestOk = r.passed && !gaveUp;  // програма лише пропонує, вирішуєш ти
    frame(`<div class="panel answer">${html}</div>`,
          `<span class="verdict ${r.passed ? "ok" : "bad"}">Збіг ${Math.round(r.score * 100)}%</span>
           <button class="big ${suggestOk ? "primary" : ""}" id="yes">✓ Зарахувати <kbd>1</kbd></button>
           <button class="big ${suggestOk ? "" : "primary"}" id="no">✗ Не зараховувати <kbd>2</kbd></button>`);
    $("#yes").onclick = () => answer(true);
    $("#no").onclick = () => answer(false);
    onKey = e => { if (e.key === "Enter") { answer(suggestOk); return true; } return keys12(e); };
  }

  show();
}

// ========================================================== Результат ===
function renderResult(results, mode) {
  const total = results.length;
  const correct = results.filter(r => r[1]).length;
  const mistakes = results.filter(r => !r[1]).map(r => r[0]);
  const pct = total ? Math.round(correct / total * 100) : 0;
  const color = pct >= 80 ? "var(--ok)" : pct >= 50 ? "var(--warn)" : "var(--bad)";

  app.innerHTML = `
    <h1>Сесію завершено</h1>
    <div class="panel result">
      ${total ? `<span class="pct" style="color:${color}">${pct}%</span><b style="font-size:19px">Правильно ${correct} з ${total}</b>`
              : `<span>Жодної відповіді не дано.</span>`}
    </div>
    ${mistakes.length ? `<h2>Помилки</h2><div class="panel">${mistakes.map(q =>
        `<div class="mistake"><b>${esc(q.text)}</b>${esc(answerText(q))}</div>`).join("")}</div>` : ""}
    <div class="actions">
      ${mistakes.length ? `<button class="primary big" id="retry">Повторити помилки</button>` : ""}
      <button class="big ${mistakes.length ? "" : "primary"}" id="menu">До меню <kbd>Enter</kbd></button>
    </div>`;
  if (mistakes.length) $("#retry").onclick = () => runSession(shuffle([...mistakes]), mode);
  $("#menu").onclick = renderMenu;
  onKey = e => { if (e.key === "Enter") { renderMenu(); return true; } };
  window.scrollTo(0, 0);
}

// ========================================================= Статистика ===
let sortCol = "pct", sortDesc = false;

function renderStats() {
  onKey = e => { if (e.key === "Escape") { renderMenu(); return true; } };
  const rows = state.questions.map(q => {
    const s = Stats.get(q);
    return { q, s, pct: s.shown ? Math.round(s.correct / s.shown * 100) : null };
  });
  const keyOf = {
    question: r => r.q.text.toLowerCase(), shown: r => r.s.shown, correct: r => r.s.correct,
    pct: r => r.pct ?? -1, box: r => r.s.box,
  }[sortCol];
  rows.sort((a, b) => { const x = keyOf(a), y = keyOf(b); return (x < y ? -1 : x > y ? 1 : 0) * (sortDesc ? -1 : 1); });

  const seen = rows.filter(r => r.s.shown);
  const shown = seen.reduce((n, r) => n + r.s.shown, 0);
  const right = seen.reduce((n, r) => n + r.s.correct, 0);
  const tiles = [
    [rows.length, "Питань"], [seen.length, "Вже траплялись"],
    [rows.filter(r => r.s.box >= 3).length, "Засвоєно (рівень ≥ 3)"],
    [shown ? Math.round(right / shown * 100) + "%" : "—", "Середня точність"],
  ];
  const heads = [["question", "Питання"], ["shown", "Показів"], ["correct", "Правильно"], ["pct", "%"], ["box", "Рівень"]];

  app.innerHTML = `
    <div class="row spread"><h1>Статистика</h1><button id="back">← Назад</button></div>
    <div class="tiles">${tiles.map(([v, c]) => `<div class="panel tile"><div class="v">${v}</div><div class="muted">${c}</div></div>`).join("")}</div>
    <div class="panel table-wrap"><table>
      <thead><tr>${heads.map(([k, t]) => `<th data-k="${k}">${t}${k === sortCol ? (sortDesc ? " ↓" : " ↑") : ""}</th>`).join("")}</tr></thead>
      <tbody>${rows.map(r => `<tr class="${!r.s.shown ? "new" : r.s.box === 0 ? "weak" : ""}">
        <td>${esc(r.q.text)}</td><td>${r.s.shown}</td><td>${r.s.correct}</td><td>${r.pct ?? "—"}</td><td>${r.s.box}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="actions">
      <button id="export">Експорт статистики</button>
      <label class="btn">Імпорт статистики<input type="file" id="import" accept=".json"></label>
      <span class="grow"></span>
      <button id="reset">Скинути</button>
    </div>
    <p class="muted">Статистика зберігається в цьому браузері. Щоб перенести її на інший пристрій, зроби експорт тут і імпорт там.</p>`;

  $("#back").onclick = renderMenu;
  $$("th").forEach(th => th.onclick = () => {
    const k = th.dataset.k;
    sortDesc = k === sortCol ? !sortDesc : false; sortCol = k; renderStats();
  });
  $("#reset").onclick = () => { if (confirm("Видалити всю статистику відповідей?")) { Stats.reset(); renderStats(); } };
  $("#export").onclick = () => {
    const blob = new Blob([JSON.stringify(Stats.data, null, 1)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `stats-${new Date().toISOString().slice(0, 10)}.json`;
    a.click(); URL.revokeObjectURL(a.href);
  };
  $("#import").onchange = e => readFile(e.target, data => {
    if (!data || typeof data !== "object" || Array.isArray(data)) { alert("Це не файл статистики."); return; }
    // Об'єднуємо: для кожного питання беремо запис, що оновлювався пізніше
    for (const [k, v] of Object.entries(data)) {
      if (!Stats.data[k] || (v.last || 0) > (Stats.data[k].last || 0)) Stats.data[k] = v;
    }
    store.set(K.stats, Stats.data); renderStats(); toast("Статистику імпортовано");
  });
}

// ============================================================== Старт ===
async function init() {
  applyTheme(currentTheme());
  // 1) питання, раніше відкриті в цьому браузері
  const saved = store.get(K.questions, null);
  if (saved) {
    try { state.questions = parseQuestions(saved); state.source = store.get(K.source, "збережений файл"); } catch {}
  }
  // 2) questions.json поруч зі сторінкою (якщо ти його виклав)
  if (!state.questions.length) {
    try {
      const resp = await fetch("questions.json", { cache: "no-cache" });
      if (resp.ok) { state.questions = parseQuestions(await resp.json()); state.source = "questions.json"; }
    } catch {}
  }
  // 3) демо-питання
  if (!state.questions.length) { state.questions = parseQuestions(DEMO); state.source = "демо-питання"; }
  renderMenu();
}
init();
</script>
